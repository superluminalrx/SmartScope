AUTO_MIGRATION=true
USE_SSL=false
USE_LONGTERMSTORAGE=False
USE_CUSTOM_PATHS=False
TIMEZONE=America/New_York
# Lets users pair devices that reach SmartScope from outside the network.
REMOTE_API_ENABLED=false

